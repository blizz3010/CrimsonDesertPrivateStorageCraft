[General]
Enabled=1
LogEnabled=1
InitDelayMs=3000

[Keybinds]
; Toggle storage crafting on/off
ToggleKey=F9
; Unload the mod entirely
UnloadKey=U
; Unload requires Ctrl+Shift held

[StorageCraft]
; Maximum distance to storage container in game units
MaxStorageDistance=1500.0
; Show chest icon next to materials sourced from storage
ShowStorageIcon=1
; Consume from inventory first before pulling from storage
InventoryPriority=1

[Logging]
; Log level: 0=Debug, 1=Info, 2=Warn, 3=Error
Level=1
